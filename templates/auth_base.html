<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FinPilot{% endblock %} — AI-Powered Finance</title>
  <meta name="description" content="FinPilot — AI-powered personal finance management">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  {% load static %}
  <link href="{% static 'css/finpilot.css' %}" rel="stylesheet">
</head>
<body class="auth-body">
{% load static %}
<div class="auth-wrapper" role="main">
  <div class="auth-brand">
    <a href="/" class="brand-link" aria-label="FinPilot home">
      <div class="brand-icon-lg" aria-hidden="true"><i class="bi bi-graph-up-arrow"></i></div>
      <span class="brand-name-lg">FinPilot</span>
    </a>
    <p class="auth-tagline">AI-Powered Personal Finance Intelligence</p>
  </div>
  <div class="auth-card">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show mb-3" role="alert" aria-live="polite">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
    {% block auth_content %}{% endblock %}
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
</body>
</html>
